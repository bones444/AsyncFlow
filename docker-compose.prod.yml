# Production override: docker compose -p asyncflow -f docker-compose.yml -f docker-compose.prod.yml up -d
# Postgres and Redis are reachable only on the compose network; nothing is published on the host.
# The bot connects to Discord outbound, so no inbound port is needed.
services:
  backend:
    build: ./backend
    container_name: asyncflow_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/asyncflow?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db
      - redis

  db:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []
