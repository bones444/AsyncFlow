services:
  db:
    image: postgres:15-alpine
    container_name: asyncflow_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=asyncflow
    ports:
      # Loopback only: reachable from this machine, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: asyncflow_redis
    # Password is passed via REDIS_URL, e.g. redis://:<password>@localhost:6379/0
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"

# volumes:
#   postgres_data:

volumes:
  postgres_data:
    external: true
    name: dailybot_postgres_data
